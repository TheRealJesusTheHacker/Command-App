org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 1.7.0: the module outgrew the Kotlin daemon's default heap —
# CI run 87's release compile died with OutOfMemoryError (GC
# overhead limit) inside IR lowering and only passed on re-run.
# The compile daemon gets its own explicit ceiling so a green
# gate is a property of the code, not of GC luck.
kotlin.daemon.jvm.options=-Xmx2816m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
