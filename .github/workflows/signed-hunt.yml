name: Sentinel App — Signed Hunt APK

# Manual dispatch only (Sphinx pattern). Builds the HUNT flavor signed
# with the owner's custodied release key, proves the signature with
# apksigner, rejects the debug certificate, and asserts the signer
# SHA-256 equals the permanent fingerprint recorded in the README:
#   e30cf3915a9a8774025d04bf3625748219ca4b9ea67bf5779cbca0a8b1f1e28d
# Secrets (Sphinx-pattern names):
#   SENTINEL_APP_KEYSTORE_BASE64  (base64 of the PKCS12 keystore)
#   SENTINEL_APP_KEYSTORE_PASSWORD
#   SENTINEL_APP_KEY_ALIAS
#   SENTINEL_APP_KEY_PASSWORD
# Fail-closed: any missing secret fails the job before a build starts;
# there is no fallback key anywhere in this pipeline.

on:
  workflow_dispatch:
    inputs:
      build_signed:
        description: "Build the signed hunt APK (needs the owner's keystore secrets)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  EXPECTED_CERT_SHA256: e30cf3915a9a8774025d04bf3625748219ca4b9ea67bf5779cbca0a8b1f1e28d

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK pieces the build names
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Run the unit tests (hunt flavor)
        run: ./gradlew :app:testHuntDebugUnitTest --console=plain

  signed-hunt:
    needs: gate
    if: inputs.build_signed
    runs-on: ubuntu-latest
    env:
      SENTINEL_APP_KEYSTORE_PASSWORD: ${{ secrets.SENTINEL_APP_KEYSTORE_PASSWORD }}
      SENTINEL_APP_KEY_ALIAS: ${{ secrets.SENTINEL_APP_KEY_ALIAS }}
      SENTINEL_APP_KEY_PASSWORD: ${{ secrets.SENTINEL_APP_KEY_PASSWORD }}
      # Gate values for the build's sealing step (see
      # app/build.gradle.kts generateGateConfig). These two secrets
      # do not exist until the Cloudflare Access layer lands (the
      # BUILD-1 record's Wall 2); while they are unset the build
      # seals empty values and the app runs unconfigured, exactly
      # as designed. They are never printed and never committed.
      SENTINEL_APP_CF_ACCESS_CLIENT_ID: ${{ secrets.SENTINEL_APP_CF_ACCESS_CLIENT_ID }}
      SENTINEL_APP_CF_ACCESS_CLIENT_SECRET: ${{ secrets.SENTINEL_APP_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK pieces the build names
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Materialise the owner's keystore from secrets
        env:
          SENTINEL_APP_KEYSTORE_BASE64: ${{ secrets.SENTINEL_APP_KEYSTORE_BASE64 }}
        run: |
          missing=""
          for v in SENTINEL_APP_KEYSTORE_BASE64 SENTINEL_APP_KEYSTORE_PASSWORD SENTINEL_APP_KEY_ALIAS SENTINEL_APP_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Signed build requested but these secrets are not set:$missing — the owner's keystore secrets are required; there is no fallback key."
            exit 1
          fi
          echo "$SENTINEL_APP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sentinel-app.p12"
          echo "SENTINEL_APP_KEYSTORE=$RUNNER_TEMP/sentinel-app.p12" >> "$GITHUB_ENV"

      - name: Build the signed hunt APK (Gradle refuses without the signing env)
        run: ./gradlew signedHuntRelease --console=plain

      - name: Verify the signature, reject the debug cert, assert the fingerprint
        run: |
          apk=$(ls app/build/outputs/apk/hunt/release/*.apk | grep -v unsigned | head -1)
          echo "Signed hunt APK: $apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -qi "Android Debug" certs.txt; then
            echo "::error::The APK carries the Android Debug certificate — refusing it."
            exit 1
          fi
          digest=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certs.txt | head -1 | tr -d '[:space:]' | tr 'A-F' 'a-f')
          echo "Signer SHA-256: $digest"
          if [ "$digest" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signer fingerprint mismatch: got $digest, expected $EXPECTED_CERT_SHA256 (the README fingerprint)."
            exit 1
          fi
          echo "Fingerprint matches the README signer identity."
          sha256sum "$apk" | tee apk-sha256.txt
          echo "SENTINEL_SIGNED_APK=$apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sentinel-app-hunt-signed-apk
          path: ${{ env.SENTINEL_SIGNED_APK }}
          if-no-files-found: error

      # The mapping for THIS signed build — the deobfuscation key
      # for any crash report from the APK above. Artifact only,
      # never committed; keep it with the build it belongs to.
      - name: Archive the R8 mapping for this hunt build (never committed)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r8-mapping-hunt
          path: app/build/outputs/mapping/huntRelease/mapping.txt
          if-no-files-found: warn
          retention-days: 90
