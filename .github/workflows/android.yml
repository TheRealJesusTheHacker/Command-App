name: Sentinel App — Android

# The push gate: unit tests (API client against a fake transport,
# contract shapes, mail rules, quiet hours, update comparison) and a
# build of both flavors. Release builds here are UNSIGNED compile
# proofs only — a step below proves the APK really is unsigned.
# Signing lives in signed-hunt.yml with the owner's custodied key.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK pieces the build names
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Run the unit tests (both flavors)
        run: ./gradlew :app:testStandardDebugUnitTest :app:testHuntDebugUnitTest --console=plain

      - name: Build both flavors (debug + unsigned release compile proof)
        run: ./gradlew assembleDebug assembleRelease --console=plain

      - name: Prove the release compile proof is unsigned
        run: |
          apk=$(ls app/build/outputs/apk/standard/release/*-unsigned.apk)
          echo "Compile proof: $apk"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk" 2>/dev/null; then
            echo "::error::The unsigned compile proof unexpectedly verifies as signed — refusing to treat it as a proof."
            exit 1
          fi
          echo "Confirmed: apksigner does not verify it — unsigned, as a compile proof must be."
